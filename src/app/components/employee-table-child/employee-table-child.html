
<div class="border border-3 rounded-3 p-3 mt-2">
    <table class="table table-bordered table-striped">
        <thead>
            <tr>
                <th class="text-success">Emp Id</th>
                <th class="text-warning">Emp Name</th>
                <th class="text-danger">Emp Role</th>
                <th class="text-primary">EMPSalary</th>
                <th class="text-secondary">EmpGender</th>
                <th class="text-primary">Emp Action</th>
            </tr>
        </thead>
        <tbody>
            @for(emp of employeeArr; track $index){
            <tr>
                <td>{{emp.id}}</td>
                <td>{{emp.name}}</td>
                <td>{{emp.role}}</td>
                <td>{{emp.salary}}</td>
                <td>{{emp.gender}}</td>
                <td><button class="btn btn-danger" (click)="deleteEmployee(emp.id)">Delete</button></td>
               
            </tr>
            }
        </tbody>
    </table>
</div>
